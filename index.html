    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;600&display=swap" rel="stylesheet">
    <style media="screen">
        *,
        *:before,
        *:after {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #080710;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        form {
            width: 260px; 
            background-color: #1a1a23; 
            border-radius: 30px; 
            padding: 30px 20px;  
            border: 2px solid #000000; 
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
            text-align: center;
            position: relative;
        }

        .settings-btn {
            position: absolute;
            top: 15px;
            left: 15px;
            width: 30px;
            height: 30px;
            color: #ff0000; 
            font-size: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            z-index: 5;
            animation: spin 0.6s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        form * {
            font-family: 'Poppins', sans-serif;
            letter-spacing: 0.5px;
            outline: none;
            border: none;
        }

        .img-container {
            position: relative;
            width: 100px; 
            height: 100px; 
            margin: 0 auto;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .form-logo {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            border-radius: 50%;
        }

        .social {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .social div {
            width: 100%;
            border-radius: 10px;
            padding: 8px;
            background-color: #2c2c38;
            color: #ffffff;
            text-align: center;
            font-size: 11px; 
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }

        .social img {
            width: 14px;
            height: 14px;
            object-fit: cover;
            border-radius: 50%;
        }
    </style>
</head>
