<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Glassmorphism BOT ZA5RAFA</title>
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;600&display=swap" rel="stylesheet">
    <style media="screen">
        *,
        *:before,
        *:after {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #080710;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        form {
            width: 260px; 
            background-color: #1a1a23; 
            border-radius: 30px; 
            padding: 30px 20px;  
            border: 2px solid #000000; 
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
            text-align: center;
            position: relative;
        }

        .settings-btn {
            position: absolute;
            top: 15px;
            left: 15px;
            width: 30px;
            height: 30px;
            color: #ff0000; 
            font-size: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            z-index: 5;
            animation: spin 0.6s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        form * {
            font-family: 'Poppins', sans-serif;
            letter-spacing: 0.5px;
            outline: none;
            border: none;
        }

        .img-container {
            position: relative;
            width: 100px; 
            height: 100px; 
            margin: 0 auto 20px auto;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .form-logo {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            border-radius: 50%;
        }

        .glass-overlay {
            position: absolute;
            width: 55px; 
            height: 55px; 
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0.02));
            backdrop-filter: blur(0px);
            -webkit-backdrop-filter: blur(0px);
            border: 1.5px solid rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            z-index: 2;
            box-shadow: inset 0 0 10px rgba(255, 255, 255, 0.05), 0 4px 10px rgba(0, 0, 0, 0.3);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        label {
            display: block;
            margin-top: 10px;
            font-size: 13px; 
            font-weight: 600;
            color: #ffffff;
            text-align: left;
        }

        input {
            display: block;
            height: 40px; 
            width: 100%;
            background-color: #2c2c38; 
            border-radius: 10px;
            padding: 0 12px;
            margin-top: 5px;
            font-size: 12px; 
            color: #ffffff;
        }

        button.login-btn {
            margin-top: 20px;
            width: 100%;
            background-color: #ffffff;
            color: #000;
            padding: 12px 0;
            font-size: 15px; 
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
        }

        .social {
            margin-top: 20px;
            display: flex;
            justify-content: space-between;
        }

        .social div {
            width: 48%;
            border-radius: 10px;
            padding: 8px;
            background-color: #2c2c38;
            color: #ffffff;
            text-align: center;
            font-size: 11px; 
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }

        .shard {
            position: absolute;
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(2px);
            border: 0.5px solid rgba(255, 255, 255, 0.8);
            pointer-events: none;
            z-index: 10;
            animation: fall-and-fade 10s forwards ease-in;
        }

        @keyframes fall-and-fade {
            0% { transform: translate(0, 0) rotate(0deg); opacity: 1; }
            100% { transform: translate(var(--x), 800px) rotate(var(--r)); opacity: 0; }
        }
    </style>
</head>
<body>
    <form onsubmit="return false;">
        <div class="settings-btn" onclick="console.log('Settings clicked')">
            <i class="fas fa-cog"></i>
        </div>

        <div class="img-container" onclick="breakGlass(this)">
            <div class="glass-overlay" id="overlay"></div>
            <img src="https://i.ibb.co/Zp089yRX/images-1.jpg" alt="Logo" class="form-logo">
        </div>

        <label for="username">Username</label>
        <input type="text" placeholder="Email or Phone" id="username">

        <label for="password">Password</label>
        <input type="password" placeholder="Password" id="password">

        <button class="login-btn">Log In</button>
        <div class="social">
            <div class="go"><i class="fab fa-google"></i> Google</div>
            <div class="fb"><i class="fab fa-facebook"></i> Facebook</div>
        </div>
    </form>

    <script>
        function breakGlass(container) {
            const overlay = document.getElementById('overlay');
            if (!overlay || overlay.style.display === 'none') return;

            // تشغيل الصوت المرفق
            const breakSound = new Audio('https://res.cloudinary.com/dpggetoyh/video/upload/VID_20260428_213549_853_rwlfop.mp4');
            breakSound.play();

            overlay.style.display = 'none';

            for (let i = 0; i < 25; i++) {
                const shard = document.createElement('div');
                shard.className = 'shard';
                const size = Math.random() * 10 + 3; 
                shard.style.width = size + 'px';
                shard.style.height = size + 'px';
                
                const rect = container.getBoundingClientRect();
                shard.style.left = (rect.left + Math.random() * rect.width) + 'px';
                shard.style.top = (rect.top + Math.random() * rect.height) + 'px';
                
                const destinationX = (Math.random() - 0.5) * 400;
                const rotation = Math.random() * 720;
                
                shard.style.setProperty('--x', destinationX + 'px');
                shard.style.setProperty('--r', rotation + 'deg');
                shard.style.clipPath = `polygon(${Math.random()*100}% ${Math.random()*100}%, ${Math.random()*100}% ${Math.random()*100}%, ${Math.random()*100}% ${Math.random()*100}%)`;

                document.body.appendChild(shard);
                
                setTimeout(() => shard.remove(), 10000);
            }
        }
    </script>
</body>
</html>
